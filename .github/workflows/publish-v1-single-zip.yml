name: Publish V1.0 Final — one complete fastboot ZIP in GHCR

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1-single-zip.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-single-full-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE_TAG: yunluo-miui14-build5-complete-firmware
      FINAL_TAG: v1.0
      ZIP_NAME: yunluo_MIUI14_Global_Build5_108Folders_GalleryRemoved_AVBDisabled_Fastboot.zip
      FINAL_SHA256: c06c6b98772cca371d7cdcf7d69025e1539780eb2c279a54e0bb122e0a05ad7c
      FINAL_BYTES: '3697320245'
      OCI_REF: ghcr.io/hashyofficial/redmi-pad-yunluo-miui-project-firmware:v1.0

    steps:
      - uses: actions/checkout@v4
      - name: Ensure final tag does not already exist
        run: |
          if gh release view "$FINAL_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to replace an already-published stable release" >&2
            exit 1
          fi
      - name: Install high-speed aria2 and verified official ORAS CLI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl ca-certificates python3 unzip
          VERSION=1.3.0
          ARCHIVE="oras_${VERSION}_linux_amd64.tar.gz"
          ASSET="https://github.com/oras-project/oras/releases/download/v${VERSION}/${ARCHIVE}"
          PUBLISHED_SHA="$(gh api repos/oras-project/oras/releases/tags/v${VERSION} --jq '.assets[] | select(.name=="'${ARCHIVE}'") | .digest' | sed 's/^sha256://')"
          test "${#PUBLISHED_SHA}" -eq 64
          curl -fL --retry 8 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/$ARCHIVE" "$ASSET"
          echo "$PUBLISHED_SHA  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" oras
          sudo install -m 755 "$RUNNER_TEMP/oras" /usr/local/bin/oras
          oras version
      - name: Download the five unchanged original release files privately for joining
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reassembly"
          BASE="https://github.com/$GH_REPO/releases/download/$BASE_TAG"
          cd "$RUNNER_TEMP/reassembly"
          for part in 000 001 002 003 004; do
            echo "$BASE/$ZIP_NAME.part-$part"
          done > "$RUNNER_TEMP/source-urls.txt"
          echo "Transferring original SHA256-verified Build5 firmware using aria2"
          timeout --signal=TERM --kill-after=30s 25m \
            aria2c --input-file="$RUNNER_TEMP/source-urls.txt" \
              --dir="$RUNNER_TEMP/reassembly" --continue=true \
              --max-concurrent-downloads=5 --max-connection-per-server=8 --split=8 \
              --min-split-size=4M --file-allocation=none --auto-file-renaming=false \
              --max-tries=15 --retry-wait=5 --connect-timeout=30 --timeout=60 \
              --summary-interval=30
          curl -fL --retry 6 --retry-all-errors -o ZIP_SHA256.txt "$BASE/ZIP_SHA256.txt"
          curl -fL --retry 6 --retry-all-errors -o PARTS_SHA256.txt "$BASE/PARTS_SHA256.txt"
          sha256sum -c PARTS_SHA256.txt
          cat "$ZIP_NAME".part-{000..004} > "$ZIP_NAME"
          test "$(stat -c '%s' "$ZIP_NAME")" -eq "$FINAL_BYTES"
          echo "$FINAL_SHA256  $ZIP_NAME" | sha256sum -c -
          sha256sum -c ZIP_SHA256.txt
          python3 - <<'PY'
          import os,zipfile
          name=os.environ["ZIP_NAME"]
          with zipfile.ZipFile(name) as z:
              names=z.namelist()
              assert any(x.endswith("/images/super.img") for x in names)
              assert any(x.endswith("/images/vbmeta.img") for x in names)
              assert any(x.endswith("/flash_all.sh") for x in names)
              assert z.testzip() is None
              print("FULL unsplit ZIP verified and contains Xiaomi firmware flashing files; members:",len(names))
          PY
          rm "$ZIP_NAME".part-* PARTS_SHA256.txt
          echo "ONE complete original Build5 firmware ZIP ready, verified SHA256 $FINAL_SHA256"
          df -h .
      - name: Push ONE complete firmware ZIP as a GHCR artifact — no split files
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/reassembly"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          timeout --signal=TERM --kill-after=45s 25m \
            oras push --no-tty \
              --artifact-type application/vnd.redmi-pad.fastboot-firmware.v1+zip \
              --annotation "org.opencontainers.image.source=https://github.com/$GH_REPO" \
              --annotation "org.opencontainers.image.version=v1.0" \
              --annotation "org.opencontainers.image.title=Redmi Pad yunluo MIUI 14 V1.0 Final Fastboot" \
              "$OCI_REF" "$ZIP_NAME:application/zip"
          oras manifest fetch "$OCI_REF" > "$RUNNER_TEMP/ghcr-manifest.json"
          python3 - <<'PY'
          import hashlib,json,os
          with open(os.environ["RUNNER_TEMP"]+"/ghcr-manifest.json") as file:
              manifest=json.load(file)
          layers=manifest.get("layers") or manifest.get("blobs") or []
          if len(layers)!=1:
              raise SystemExit("Expected exactly one GHCR blob for the complete firmware ZIP")
          layer=layers[0]
          if layer["digest"]!="sha256:"+os.environ["FINAL_SHA256"] or layer["size"]!=int(os.environ["FINAL_BYTES"]):
              raise SystemExit("GHCR blob digest/size differs from boot-confirmed Build5 ZIP")
          print("VERIFIED: GHCR contains one entire 3.697 GB ZIP blob, digest",layer["digest"])
          PY
          oras logout ghcr.io
      - name: Publish stable Release V 1.0 Final with changelog, checksum and single-ZIP downloader
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/reassembly"
          grep -q "$FINAL_SHA256" ZIP_SHA256.txt
          gh release create "$FINAL_TAG" \
            "$GITHUB_WORKSPACE/download_full_zip.sh" ZIP_SHA256.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Release V 1.0 Final — Final Fastboot Image" \
            --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES_V1.md" \
            --latest
          gh release view "$FINAL_TAG" --repo "$GH_REPO" --json url,isPrerelease,isDraft,assets \
            --jq '{url:.url,isPrerelease:.isPrerelease,isDraft:.isDraft,assets:[.assets[].name]}'
      - name: Print package visibility configuration reminder
        if: success()
        run: |
          echo "GHCR package publication succeeded."
          echo "NOTE: GitHub defaults a new GHCR package to PRIVATE."
          echo "For public download, the repo owner must open the package settings"
          echo "and change visibility to Public. This does not affect the ZIP checksum."
          echo "The single ZIP is not a time-limited GitHub Actions artifact."
