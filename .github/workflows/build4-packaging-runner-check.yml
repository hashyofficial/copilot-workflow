name: Build 4 firmware packaging runner preflight
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build4-packaging-runner-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse both repack workflows and report YAML errors
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          Dir['.github/workflows/*repack*.yml'].each do |f|
            begin
              y=YAML.parse_file(f)
              puts "#{f}: YAML parsed"
            rescue => e
              warn "#{f}: #{e.message}"
            end
          end
          RUBY
