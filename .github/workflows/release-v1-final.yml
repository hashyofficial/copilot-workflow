name: Release V1.0 Final — two halves of the complete boot-tested Build 5 fastboot ZIP

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_TAG: yunluo-miui14-build5-complete-firmware
      ORIGINAL_ZIP: yunluo_MIUI14_Global_Build5_108Folders_GalleryRemoved_AVBDisabled_Fastboot.zip
      FINAL_ZIP: Redmi_Pad_Yunluo_MIUI14_V1.0_Final_Fastboot.zip
      FINAL_TAG: v1.0.0
      SOURCE_SHA256: c06c6b98772cca371d7cdcf7d69025e1539780eb2c279a54e0bb122e0a05ad7c
      SOURCE_BYTES: "3697320245"
    steps:
      - uses: actions/checkout@v4
      - name: Install verified fast download and ZIP-checking tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 unzip
          df -h "$RUNNER_TEMP"
      - name: Download ALL five already-verified Build 5 release parts using aria2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v1"
          cd "$RUNNER_TEMP/v1"
          BASE="https://github.com/$GH_REPO/releases/download/$SOURCE_TAG"
          for number in 000 001 002 003 004; do
            printf '%s/%s.part-%s\n' "$BASE" "$ORIGINAL_ZIP" "$number"
          done > download-urls.txt
          aria2c -i download-urls.txt --continue=true \
            --max-concurrent-downloads=5 --max-connection-per-server=8 --split=8 \
            --min-split-size=4M --file-allocation=none --auto-file-renaming=false \
            --max-tries=15 --retry-wait=5 --connect-timeout=25 --timeout=60 \
            --summary-interval=20
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            --output SOURCE_PARTS_SHA256.txt "$BASE/PARTS_SHA256.txt"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 \
            --output SOURCE_ZIP_SHA256.txt "$BASE/ZIP_SHA256.txt"
          sha256sum -c SOURCE_PARTS_SHA256.txt
          echo "All original five Build 5 parts verified."
      - name: Reconstruct exact previously boot-tested Build5 ZIP and verify firmware files
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          cat "$ORIGINAL_ZIP".part-{000..004} > "$FINAL_ZIP"
          test "$(stat -c '%s' "$FINAL_ZIP")" = "$SOURCE_BYTES"
          sha256sum "$FINAL_ZIP"
          echo "$SOURCE_SHA256  $FINAL_ZIP" > V1_FINAL_SHA256.txt
          sha256sum -c V1_FINAL_SHA256.txt
          python3 - <<'PY'
          import hashlib,os,struct,zipfile
          file=os.path.join(os.environ['RUNNER_TEMP'],'v1',os.environ['FINAL_ZIP'])
          root='yunluo_global_images_V14.0.4.0.TLYMIXM_13.0/'
          with zipfile.ZipFile(file) as z:
              files=set(z.namelist())
              required={
                  'flash_all.sh',
                  'images/super.img','images/vbmeta.img',
                  'images/crclist.txt','images/sparsecrclist.txt',
                  'images/MT6789_Android_scatter.txt',
                  'images/MT6789_Android_scatter.xml',
              }
              missing={root+item for item in required}-files
              if missing:raise SystemExit('Missing firmware files: '+str(missing))
              vb=z.read(root+'images/vbmeta.img')
              if len(vb)!=8192 or vb[:4]!=b'AVB0' or struct.unpack_from('>I',vb,120)[0]!=3:
                  raise SystemExit('Final archive vbmeta.img is not AVB-disabled')
              expected_vb='11322edca2df064b4d7b790bd2fb278c6083e8bec8cd47f4d5774d34ae3e4af9'
              if hashlib.sha256(vb).hexdigest()!=expected_vb:
                  raise SystemExit('Final vbmeta.img does not match offline-validated Build 5')
              sh=z.read(root+'flash_all.sh').decode()
              for word in ('flash vbmeta_ab ', '/images/vbmeta.img','flash super ', '/images/super.img','set_active a'):
                  if word not in sh:raise SystemExit('Expected original fastboot flash target absent: '+word)
              if z.getinfo(root+'images/super.img').file_size < 3000000000:
                  raise SystemExit('Full sparse super image missing or truncated')
              corrupted=z.testzip()
              if corrupted:raise SystemExit('Corrupt ZIP member '+corrupted)
              print('Build 5 firmware ZIP fully verified: files intact, AVB flags=3, two original flash targets, CRC-lists present.',flush=True)
          PY
      - name: Split full verified ZIP into exactly TWO nearly equal downloadable halves
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'v1'
          name=os.environ['FINAL_ZIP']
          archive=folder/name
          size=archive.stat().st_size
          first=(size+1)//2
          second=size-first
          if first>=2000000000 or second>=2000000000:
              raise SystemExit('Cannot fit final firmware into two GitHub Release assets under 2GB each')
          parts=[]
          digest=hashlib.sha256()
          with archive.open('rb') as src:
              for suffix,target_length in (('001',first),('002',second)):
                  path=folder/(name+'.'+suffix)
                  h=hashlib.sha256()
                  remain=target_length
                  with path.open('wb') as out:
                      while remain:
                          buf=src.read(min(remain,8*1024*1024))
                          if not buf:raise SystemExit('Unexpected EOF splitting full ZIP')
                          out.write(buf);h.update(buf);digest.update(buf);remain-=len(buf)
                  parts.append(dict(file=path.name,bytes=path.stat().st_size,sha256=h.hexdigest()))
              if src.read(1):raise SystemExit('Unexpected trailing bytes after splitting ZIP')
          if digest.hexdigest()!=os.environ['SOURCE_SHA256']:
              raise SystemExit('Two halves differ from source ZIP SHA256')
          with (folder/'PARTS_SHA256.txt').open('w') as out:
              for p in parts:out.write(p['sha256']+'  '+p['file']+'\n')
          manifest={'release':'Release V1.0 Final — Fastboot Image','tag':'v1.0.0',
              'device':'Xiaomi Redmi Pad yunluo','base':'MIUI 14 Global V14.0.4.0.TLYMIXM Android 13',
              'zip_name':name,'zip_bytes':size,'zip_sha256':digest.hexdigest(),
              'part_count':2,'parts':parts,
              'apps_removed':108,'gallery_folder_removed':True,'added_apks':0,'vbmeta_flags':3,
              'flash_tested_on_project_redmi_pad':True,
              'assembly':'cat '+name+'.001 '+name+'.002 > '+name}
          (folder/'V1_DOWNLOAD_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({'zip_sha256':digest.hexdigest(),'parts':parts},indent=2),flush=True)
          PY
          sha256sum -c PARTS_SHA256.txt
          sha256sum -c V1_FINAL_SHA256.txt
      - name: Prepare a single-command Linux extractor and verify that it references ONLY these two halves
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          cat > EXTRACT_LINUX.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          ZIP="Redmi_Pad_Yunluo_MIUI14_V1.0_Final_Fastboot.zip"
          for PART in "$ZIP.001" "$ZIP.002" "PARTS_SHA256.txt" "V1_FINAL_SHA256.txt"; do
            if [[ ! -f "$PART" ]]; then
              echo "Missing $PART — download BOTH ZIP halves and both checksum files from the same v1.0.0 GitHub Release." >&2
              exit 1
            fi
          done
          sha256sum -c PARTS_SHA256.txt
          cat "$ZIP.001" "$ZIP.002" > "$ZIP"
          sha256sum -c V1_FINAL_SHA256.txt
          unzip -tq "$ZIP"
          unzip "$ZIP"
          echo "Final fastboot firmware extracted. Bootloader must remain unlocked. Do not run flash_all_lock.sh."
          SH
          chmod 755 EXTRACT_LINUX.sh
          bash -n EXTRACT_LINUX.sh
          echo "V1 Final assets ready:"
          ls -lh "$FINAL_ZIP".0* PARTS_SHA256.txt V1_FINAL_SHA256.txt V1_DOWNLOAD_MANIFEST.json EXTRACT_LINUX.sh
          rm "$FINAL_ZIP"
          df -h "$RUNNER_TEMP"
      - name: Publish STABLE Release V1.0 Final with two complete ZIP halves and changelog
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/v1"
          gh release create "$FINAL_TAG" \
            "$FINAL_ZIP.001" "$FINAL_ZIP.002" \
            PARTS_SHA256.txt V1_FINAL_SHA256.txt V1_DOWNLOAD_MANIFEST.json EXTRACT_LINUX.sh \
            -R "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Release V1.0 Final – Fastboot Image (MIUI 14 / Redmi Pad yunluo)" \
            --notes-file "$GITHUB_WORKSPACE/CHANGELOG.md" \
            --latest
      - name: Confirm public assets contain only TWO firmware halves and no expiry-based Actions artifacts
        run: |
          set -euo pipefail
          gh release view "$FINAL_TAG" -R "$GH_REPO" --json url,isPrerelease,isDraft,assets \
            --jq '{url:.url,isPrerelease:.isPrerelease,isDraft:.isDraft,assets:[.assets[]|{name:.name,size:.size}]}'
          gh api "/repos/$GH_REPO/releases/tags/$FINAL_TAG" --jq '.assets | map(select(.name | endswith(".zip.001") or endswith(".zip.002"))) | length' | grep -qx 2
